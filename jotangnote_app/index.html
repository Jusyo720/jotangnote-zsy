<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JotangNote - AI 智能笔记</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f4f7f6; --white: #ffffff; --text: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); height: 100vh; display: flex; flex-direction: column; }

        /* 顶部导航 */
        .navbar { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .navbar h1 { font-size: 1.2rem; }
        .user-info { font-size: 0.9rem; display: none; align-items: center; gap: 10px; }
        .btn-logout { background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }

        /* 主体布局 */
        .main-container { display: flex; flex: 1; overflow: hidden; max-width: 1400px; width: 100%; margin: 0 auto; }
        
        /* 左侧：笔记区 */
        .notes-panel { width: 350px; background: var(--white); border-right: 1px solid #ddd; display: flex; flex-direction: column; }
        .panel-header { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
        .note-list { flex: 1; overflow-y: auto; padding: 10px; }
        .note-item { background: #f9f9f9; padding: 10px; margin-bottom: 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s; }
        .note-item:hover, .note-item.active { border-color: var(--primary); background: #eef6ff; }
        .note-title { font-weight: bold; margin-bottom: 4px; font-size: 0.9rem; }
        .note-preview { font-size: 0.8rem; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 右侧：AI 聊天区 */
        .chat-panel { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #f9f9f9; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95rem; word-wrap: break-word; }
        .message.user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .message.ai { align-self: flex-start; background: white; border: 1px solid #e0e0e0; border-bottom-left-radius: 2px; }

        /* 输入区域通用样式 */
        .input-area { padding: 15px; border-top: 1px solid #eee; background: white; display: flex; gap: 10px; }
        input, textarea { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; resize: none; }
        button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #357abd; }
        button:disabled { background: #ccc; cursor: not-allowed; }

        /* 登录遮罩层 - 确保唯一性 */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-box { background: white; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .auth-box h2 { text-align: center; margin-bottom: 20px; color: var(--primary); }
        .auth-form input { width: 100%; margin-bottom: 15px; padding: 12px; }
        .auth-form button { width: 100%; margin-bottom: 10px; }
        .switch-auth { text-align: center; font-size: 0.85rem; color: #666; cursor: pointer; }
        .switch-auth:hover { color: var(--primary); }

        /* 加载动画 */
        .loading-dots::after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '...'; } }
        
        /* 隐藏类 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <div class="navbar">
        <h1>JotangNote AI</h1>
        <div class="user-info" id="userInfo">
            <span id="usernameDisplay">User</span>
            <button class="btn-logout" onclick="logout()">退出</button>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-container" id="mainApp">
        <!-- 左侧：笔记列表 -->
        <div class="notes-panel">
            <div class="panel-header">
                <span>我的笔记</span>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="text" id="newNoteTitle" placeholder="输入标题" style="width: 80px; display: none; padding: 2px 5px;">
                    <button onclick="startCreateNote()" style="padding: 5px 10px; font-size: 0.8rem;">+ 新建</button>
                </div>
            </div>
            <div class="note-list" id="noteList">
                <!-- 笔记项将在这里渲染 -->
            </div>
            <div class="input-area" style="flex-direction: column;">
                <textarea id="noteContent" rows="3" placeholder="在此编辑或查看笔记内容..."></textarea>
                <div style="display: flex; gap: 5px;">
                    <button onclick="saveNote()" style="flex: 1;">保存/更新</button>
                    <button onclick="deleteNote()" id="deleteBtn" style="background: #e74c3c; flex: 1;">删除</button>
                </div>
            </div>
        </div>

        <!-- 右侧：AI 对话 -->
        <div class="chat-panel">
            <div class="chat-box" id="chatBox">
                <div class="message ai">你好！我是 JotangNote 助手。你可以问我关于笔记的问题，或者让我帮你查询特定 ID 的笔记内容。</div>
            </div>
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter') sendChat()">
                <button onclick="sendChat()" id="sendBtn">发送</button>
            </div>
        </div>
    </div>

    <!-- 登录/注册弹窗（唯一） -->
    <div class="auth-overlay" id="authOverlay">
        <div class="auth-box">
            <h2 id="authTitle">登录 JotangNote</h2>
            <div class="auth-form">
                <input type="text" id="authUser" placeholder="用户名">
                <input type="password" id="authPass" placeholder="密码">
                <button onclick="handleAuth()" id="authBtn">登录</button>
                <div class="switch-auth" onclick="toggleAuthMode()" id="switchText">没有账号？去注册</div>
            </div>
        </div>
    </div>

<script>
    // ================= 配置区 =================
    const API_BASE = "http://127.0.0.1:5000/api/v1"; // 笔记服务端口
    const AI_URL = "http://127.0.0.1:5001/chat";     // AI 服务端口
    
    // 全局状态
    let currentUserId = null; // 这里必须存数字 ID
    let currentUser = null;   // 存用户名仅用于展示
    let currentNoteId = null;
    let isLoginMode = true;

    // ================= 认证逻辑 =================
    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('authTitle').innerText = isLoginMode ? "登录 JotangNote" : "注册新账号";
        document.getElementById('authBtn').innerText = isLoginMode ? "登录" : "注册";
        document.getElementById('switchText').innerText = isLoginMode ? "没有账号？去注册" : "已有账号？去登录";
    }

    async function handleAuth() {
        const username = document.getElementById('authUser').value;
        const password = document.getElementById('authPass').value;
        
        // 增加调试信息，确认是不是读到了空值
        if (!username || !password) {
            alert("请确保用户名和密码输入框中都有内容！(当前读取到: " + username + ")");
            return;
        }

        const endpoint = isLoginMode ? "/auth/login" : "/auth/register";
        try {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            
            if (res.ok && (data.code === 200 || data.code === 201)) {
                // 登录成功：保存后端返回的数字 user_id
                if (isLoginMode) {
                    currentUserId = data.data.user_id;
                    currentUser = username;
                    document.getElementById('authOverlay').classList.add('hidden');
                    document.getElementById('userInfo').style.display = 'flex';
                    document.getElementById('usernameDisplay').innerText = username;
                    // 如果后端有列表接口可调用，这里调用
                    loadNotes();
                } else {
                    // 注册成功，提示切换回登录
                    alert("注册成功！请登录。");
                    toggleAuthMode();
                }
            } else {
                alert(data.msg || "操作失败");
            }
        } catch (e) { alert("连接服务器失败，请检查 app.py 是否启动"); }
    }

    function logout() {
        currentUserId = null;
        currentUser = null;
        currentNoteId = null;
        document.getElementById('authOverlay').classList.remove('hidden');
        document.getElementById('userInfo').style.display = 'none';
        document.getElementById('noteList').innerHTML = '';
        document.getElementById('noteContent').value = '';
    }

    // ================= 笔记逻辑 =================
    async function loadNotes() {
        if (!currentUserId) return;
        try {
            const res = await fetch(`${API_BASE}/notes?user_id=${currentUserId}`); 
            const data = await res.json();
            
            const listEl = document.getElementById('noteList');
            listEl.innerHTML = '';
            
            const notes = data.notes || data; 
            
            if (Array.isArray(notes)) {
                notes.forEach(note => {
                    const div = document.createElement('div');
                    div.className = 'note-item';
                    div.innerHTML = `<div class="note-title">ID: ${note.id}</div><div class="note-preview">${note.content.substring(0, 30)}...</div>`;
                    div.onclick = () => selectNote(note.id, note.content);
                    listEl.appendChild(div);
                });
            }
        } catch (e) { console.log("加载笔记列表失败", e); }
    }

    function selectNote(id, content) {
        currentNoteId = id;
        document.getElementById('noteContent').value = content;
        document.getElementById('newNoteTitle').style.display = 'none';
        document.getElementById('deleteBtn').style.display = 'block';
    }

    function startCreateNote() {
        currentNoteId = null;
        document.getElementById('noteContent').value = '';
        document.getElementById('newNoteTitle').style.display = 'inline-block';
        document.getElementById('newNoteTitle').value = '';
        document.getElementById('deleteBtn').style.display = 'none';
        document.getElementById('noteContent').focus();
    }

    async function saveNote() {
        if (!currentUserId) return;
        const content = document.getElementById('noteContent').value;
        const titleInput = document.getElementById('newNoteTitle');
        const title = titleInput.value || '新笔记';

        try {
            let res;
            let url = `${API_BASE}/notes`;
            let method = 'POST';

            if (currentNoteId) {
                url = `${API_BASE}/notes/${currentNoteId}`;
                method = 'PUT';
            }

            res = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: currentUserId, title: title, content: content })
            });

            if (res.ok) {
                titleInput.style.display = 'none';
                document.getElementById('deleteBtn').style.display = 'block';
                loadNotes();
            } else {
                const errData = await res.json();
                alert(errData.msg || "保存失败");
            }
        } catch (e) { alert("保存失败，请检查后端"); }
    }

    async function deleteNote() {
        if (!currentNoteId || !currentUserId) return;
        if (!confirm("确定删除此笔记吗？")) return;

        try {
            const res = await fetch(`${API_BASE}/notes/${currentNoteId}?user_id=${currentUserId}`, {
                method: 'DELETE'
            });
            if (res.ok) {
                currentNoteId = null;
                document.getElementById('noteContent').value = '';
                loadNotes();
            }
        } catch (e) { alert("删除失败"); }
    }

    // ================= AI 聊天逻辑 =================
    async function sendChat() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage(text, 'user');
        input.value = '';
        
        const loadingId = appendMessage('正在思考', 'ai', true);
        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        try {
            const res = await fetch(AI_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: text, session_id: `web_${currentUserId || 'guest'}` })
            });
            const data = await res.json();
            
            removeMessage(loadingId);
            if (data.reply) {
                appendMessage(data.reply, 'ai');
            } else {
                appendMessage("AI 出错了：" + (data.error || "未知错误"), 'ai');
            }
        } catch (e) {
            removeMessage(loadingId);
            appendMessage("无法连接到 AI 服务 (5001端口)。", 'ai');
        } finally {
            btn.disabled = false;
            input.focus();
        }
    }

    function appendMessage(text, type, isLoading = false) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message ${type} ${isLoading ? 'loading-dots' : ''}`;
        div.innerText = text;
        if (isLoading) div.id = 'temp-loading';
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return isLoading ? 'temp-loading' : null;
    }

    function removeMessage(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
    }
</script>
</body>
</html>
